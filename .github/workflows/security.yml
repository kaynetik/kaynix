# Security scanning: secrets in git history, static analysis, optional Nix closure CVE hints.
# Renovate is planned separately.
# Grype on the formatter closure can be noisy (Nix store paths);
## tune --fail-on or use continue-on-error below.

name: Security

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  pull-requests: read
  security-events: write
  # upload-sarif uses the Actions API for run metadata; without this the step fails with
  # "Resource not accessible by integration" (see github/codeql-action#2117).
  actions: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.2"
  TRUFFLEHOG_VERSION: "3.88.4"
  # linux_amd64 tarball, from the release's checksums.txt. Bump with the version.
  TRUFFLEHOG_SHA256: "ba4b1135098a22e7ac55e0c11d8991a8735adaa51e3eb4e6035a3cb0256d4195"
  OSV_SCANNER_VERSION: "1.9.2"
  # Third-party actions still on @actions/core Node 20 (e.g. nix-installer-action): opt into Node 24 early.
  # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  secrets-and-static:
    name: Secrets and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: ShellCheck (tracked *.sh)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          mapfile -t files < <(git ls-files '*.sh')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No tracked .sh files"
            exit 0
          fi
          shellcheck "${files[@]}"

      - name: detect-secrets (baseline)
        run: |
          python3 -m pip install --disable-pip-version-check -q "detect-secrets==1.5.0" "gibberish-detector"
          detect-secrets scan --baseline .secrets.baseline --slim

      - name: Semgrep
        run: |
          python3 -m pip install --disable-pip-version-check -q semgrep
          # Limit scope to first-party config; Neovim plugin trees are huge and mostly upstream.
          semgrep scan --error --metrics off --jobs 2 \
            --config p/security-audit \
            --config p/secrets \
            --exclude 'homes/static/nvim' \
            flake.nix homes modules scripts .github

      - name: OSV-Scanner
        run: |
          curl -sSfL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          chmod +x osv-scanner
          ./osv-scanner scan -r .

      - name: Install Gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Gitleaks (SARIF + fail on leak)
        run: |
          gitleaks detect --source . --verbose --redact \
            --report-path gitleaks-results.sarif \
            --report-format sarif

      - name: Upload Gitleaks SARIF
        if: >-
          always() && hashFiles('gitleaks-results.sarif') != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: gitleaks-results.sarif

      - name: Install TruffleHog
        run: |
          tarball="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${tarball}"
          echo "${TRUFFLEHOG_SHA256}  ${tarball}" | sha256sum -c -
          sudo tar -xz -C /usr/local/bin -f "$tarball" trufflehog

      - name: TruffleHog (git, full history)
        run: |
          # --no-update: self-updater cannot replace /usr/local/bin on Actions (permission / move errors).
          # lazy-lock.json commit SHAs trigger the GitHub detector as false positives; nvim tree is upstream-heavy (same as Semgrep scope).
          cat > /tmp/trufflehog-exclude.txt <<'EOF'
          .*lazy-lock\.json$
          ^homes/static/nvim/
          EOF
          trufflehog git "file://${GITHUB_WORKSPACE}" --fail --no-update \
            -x /tmp/trufflehog-exclude.txt

  nix-grype:
    name: Nix flake check + Grype (formatter closure)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # kaynix-vault is a private sibling repo; CI evaluates against a stub
      # assembled from the public example files.
      - name: Vault stub
        run: echo "VAULT_STUB=$(scripts/vault-stub)" >> "$GITHUB_ENV"

      - name: Flake check (no build)
        run: |
          nix flake check --no-build --accept-flake-config --no-write-lock-file \
            --override-input kaynix-vault "path:${VAULT_STUB}"

      - name: Build formatter output
        run: |
          nix build .#formatter.aarch64-darwin -L --accept-flake-config --no-write-lock-file \
            --override-input kaynix-vault "path:${VAULT_STUB}" -o result

      - name: Install Grype and Syft
        run: brew install grype syft

      - name: Grype scan formatter store path
        continue-on-error: true
        run: |
          target=$(readlink ./result)
          echo "Scanning $target"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          # Syft with explicit source metadata avoids "no explicit name and version" warnings from Grype's Syft driver.
          syft scan "dir:${target}" -o syft-json \
            --source-name flake-formatter \
            --source-version "$(basename "$target")" > "$tmp"
          grype -o table < "$tmp"
          grype --fail-on high < "$tmp"

      - name: vulnix (optional)
        continue-on-error: true
        run: |
          target=$(readlink ./result)
          if nix run nixpkgs#vulnix -- -S "$target"; then
            echo "vulnix ok"
          else
            echo "vulnix skipped or failed (common on darwin); see log"
          fi
