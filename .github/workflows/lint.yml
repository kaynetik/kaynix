name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      # gitleaks scans staged changes only; security.yml scans full history.
      # nix flake check evaluates the darwin config and runs in security.yml.
      - name: pre-commit
        env:
          SKIP: gitleaks,nix-flake-check
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure
